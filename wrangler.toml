# Cloudflare Workers configuration for Der SprachCoach.
#
# This is an assets-only Worker (no JS entry point): the contents of
# ./dist are served directly from Cloudflare's edge. The Vue Router is
# in hash mode so deep links never hit the server, but we still enable
# single-page-application fallback so any unknown path returns
# index.html instead of a 404.
#
# CI usage (Cloudflare → Workers & Pages → Builds):
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
#
# Local usage:
#   npm run deploy

name = "der-sorach-coach"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
