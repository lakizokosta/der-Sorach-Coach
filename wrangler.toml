# Cloudflare Workers configuration for Der SprachCoach.
#
# The Worker serves:
#   - `/api/questions` — Premium question bank (auth via GAS, server-side)
#   - static SPA assets from `./dist`
#
# CI usage (Cloudflare → Workers & Pages → Builds):
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
#
# Local usage:
#   npm run deploy

name = "der-sorach-coach"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[vars]
SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0oSHhowmjag6KMvsSd8C7nBkTduQ93L25Vv1yn6mY_7y6D_XEMxDRg5UuAvN36nkuRA/exec"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
