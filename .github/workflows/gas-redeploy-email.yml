name: GAS redeploy email reminder

# Proactive e-mail ~24h before OAuth token expiry.
# Cron runs only from default branch (main). 07:00 UTC ≈ 09:00 Berlin (CEST).

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  daily-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check redeploy need
        id: monitor
        run: |
          set +e
          node scripts/monitor-gas-backend.mjs --json > monitor-report.json
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          cat monitor-report.json
          exit 0
        env:
          WORKER_URL: https://lernziel-deutsch.de

      - name: Send e-mail
        if: steps.monitor.outputs.exit_code != '0'
        id: notify
        run: node scripts/notify-monitor.mjs monitor-report.json
        continue-on-error: true
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}

      - name: SMTP fallback (when GAS is down)
        if: steps.monitor.outputs.exit_code != '0' && steps.notify.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '[SprachCoach Monitor] GAS redeploy prüfen'
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: Der SprachCoach Monitor
          body: file://monitor-email-body.txt

      - name: Fail on critical backend down
        if: steps.monitor.outputs.exit_code == '1'
        run: exit 1
