name: Backend health

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke test GAS + Worker
        run: npm run backend:verify
        env:
          WORKER_URL: https://lernziel-deutsch.de
