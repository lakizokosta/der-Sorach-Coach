name: Backend health

# Checks GAS + Worker hourly. E-mail ONLY when a live outage is detected.
# Workflow always succeeds (exit 0) — no GitHub "run failed/succeeded" spam.
# Cron runs only from default branch (main).

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Monitor GAS + Worker
        id: monitor
        run: |
          set +e
          node scripts/monitor-gas-backend.mjs --json > monitor-report.json
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" != "0" ]; then
            echo "send_email=true" >> "$GITHUB_OUTPUT"
          else
            echo "send_email=false" >> "$GITHUB_OUTPUT"
          fi
          cat monitor-report.json
          exit 0
        env:
          WORKER_URL: https://lernziel-deutsch.de

      - name: Send e-mail (outage only)
        if: steps.monitor.outputs.send_email == 'true'
        id: notify
        run: node scripts/notify-monitor.mjs monitor-report.json
        continue-on-error: true
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}

      - name: SMTP fallback (when GAS is down)
        if: steps.monitor.outputs.send_email == 'true' && steps.notify.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '[SprachCoach Monitor] KRITISCH — GAS redeploy'
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: Der SprachCoach Monitor
          body: file://monitor-email-body.txt
